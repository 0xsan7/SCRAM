name: CI

on:
  push:
    branches: [main]
    # Tag pushes. Without this the release job below never runs: it is
    # gated on `startsWith(github.ref, 'refs/tags/v')`, but a workflow
    # that only listens to `branches: [main]` is never invoked for a tag
    # at all, so the gate is never evaluated.
    #
    # Found by cutting v0.1.0-rc1 and watching nothing happen. The
    # `if:` on the job looked like it was doing the work; it was only
    # deciding whether to run a job that was never scheduled.
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, vet (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Current and previous Go, all three OSes. The unit and integration
      # suite is where a platform difference shows up -- a path separator in
      # a lockfile parser, a case-insensitive filesystem, a different git
      # -- so it runs everywhere. Fuzzing stays Linux-only: it is
      # CPU-bound, and tripling it buys no coverage.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23', '1.24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify dependencies
        # NFR-2: this is a security tool, so its own supply chain is the
        # credibility test. Verify checksums rather than trusting the proxy.
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        # A Go program, not a shell one-liner. This step was the only one
        # failing on windows-latest, on two separate fixes: first because
        # pwsh cannot parse `[ -n "$x" ]`, then -- after adding
        # `shell: bash` -- still, for a reason that log access was not
        # available to diagnose. Rather than guess a third time, the check
        # no longer has a shell. It is also stricter: it compares the
        # formatted output against the file rather than trusting an exit
        # code, and it skips testdata/, which holds deliberately malformed
        # fuzz crashers and real-world lockfile fixtures.
        run: go run ./cmd/gofmtcheck

      - name: Test
        run: go test -race ./...

      # Coverage is computed once, on one platform. Uploading a different
      # number from each of six jobs would be six claims to reconcile, and
      # the coverage of a Go program does not depend on the OS it ran on.
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.23'
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Report coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.23'
        # `shell: bash` for the same reason as the formatting step: this job
        # runs on windows-latest too, and pwsh does not accept a bare
        # `| tail -1`. Guarded by `if:` so it only executes on Linux, but a
        # step whose shell is wrong is still a step whose shell is wrong.
        shell: bash
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.23'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      # Pinned to an exact version. golangci-lint is a security tool's
      # linter; taking whatever is newest is the same mistake as pulling an
      # unpinned action.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5

  govulncheck:
    name: govulncheck (self)
    runs-on: ubuntu-latest
    # Scheduled rather than on every push: it queries the Go vulnerability
    # database, so running it on every PR is slow and rate-limit prone.
    # A vulnerability scanner running the official Go checker on itself is
    # the cheapest credibility available for this project.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  dogfood:
    name: SCRAM scans itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build scram
        run: go build -o scram ./cmd/scram

      - name: Run scram on its own repo
        # The scan must pass on SCRAM's own dependency tree. It is configured
        # to fail closed, so a network problem here fails the job rather than
        # quietly reporting "clean".
        run: ./scram scan . --sbom cyclonedx,spdx --epss

      - name: Save the score for the badge
        # The README carries a live self-score badge. It is generated from
        # THIS scan rather than a second one, so the badge and the CI result
        # cannot disagree.
        run: ./scram scan . --format json > scram-selfscan.json

      - name: Render the self-score badge
        # Published as a CI artifact rather than committed, so the badge is
        # rebuilt every run instead of drifting from the real score. A
        # committed badge is exactly the stale-claim problem this feature
        # exists to avoid.
        run: ./scram badge --in scram-selfscan.json > badge.json && cat badge.json

      - name: Upload self-scan and badge
        uses: actions/upload-artifact@v4
        with:
          name: selfscore
          path: |
            scram-selfscan.json
            badge.json
          if-no-files-found: error

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: scram-output/
          if-no-files-found: ignore

  sbom-validate:
    name: Validate SBOM against official schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate SBOMs from the fixture repo
        run: |
          go build -o scram ./cmd/scram
          ./scram sbom generate testdata/fixtures/npm --format both --out out

      - name: Validate CycloneDX 1.5
        # FR-103/FR-104 require output that passes the official validators,
        # not just our own eyeballs. The published JSON schemas are the
        # normative artifacts for both specs.
        run: |
          pip install --quiet jsonschema
          curl -sSfL -o /tmp/bom-1.5.schema.json \
            https://raw.githubusercontent.com/CycloneDX/specification/master/schema/bom-1.5.schema.json
          python - <<'PY'
          import json, sys, jsonschema
          schema = json.load(open('/tmp/bom-1.5.schema.json'))
          doc = json.load(open('out/sbom.cdx.json'))
          errs = list(jsonschema.Draft7Validator(schema).iter_errors(doc))
          if errs:
              for e in errs[:20]:
                  print(f"  {list(e.path)}: {e.message}", file=sys.stderr)
              sys.exit(1)
          print("CycloneDX 1.5 valid")
          PY

      - name: Validate SPDX 2.3
        run: |
          curl -sSfL -o /tmp/spdx-schema.json \
            https://raw.githubusercontent.com/spdx/spdx-spec/v2.3/schemas/spdx-schema.json
          python - <<'PY'
          import json, sys, jsonschema
          schema = json.load(open('/tmp/spdx-schema.json'))
          doc = json.load(open('out/sbom.spdx.json'))
          errs = list(jsonschema.Draft7Validator(schema).iter_errors(doc))
          if errs:
              for e in errs[:20]:
                  print(f"  {list(e.path)}: {e.message}", file=sys.stderr)
              sys.exit(1)
          print("SPDX 2.3 valid")
          PY

  corpus:
    name: Corpus invariant
    # The real-world lockfile corpus: 86 files, every one of which must
    # resolve non-empty. This is the job that would have caught D22, D23,
    # D25, D28, and D37, and it is separate from `go test` because the
    # property it enforces is about the fixture set as a whole.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Every corpus lockfile resolves non-empty
        run: go run ./cmd/corpus-check

      - name: Fetcher regression tests
        run: python3 scripts/test_fetch_corpus.py

      - name: Check the decision index and the ADRs
        run: |
          set -euo pipefail
          # Two generated documents with one source of truth.
          # gen_decision_index.py guards the table inside DECISIONS.md;
          # gen_adrs.py guards docs/adr/, and additionally fails if any
          # line of the source is missing from the generated ADRs. That
          # second check is why the split is safe to regenerate: "no
          # content lost" is verified, not promised.
          python3 scripts/gen_decision_index.py --check
          python3 scripts/gen_adrs.py --check
          # The changelog is generated from commit subjects, and
          # scripts/gen_changelog.py duplicates .goreleaser.yml's grouping
          # rules so the notes can be reviewed before a tag exists. This
          # is what stops those two copies from drifting.
          python3 scripts/gen_changelog.py --check-goreleaser
          # action.yml feeds a Marketplace listing, where a bad icon or
          # colour is only noticed at submission time.
          go build -o bin/yaml2json ./cmd/yaml2json
          python3 scripts/check_action_metadata.py

  release:
    name: Release
    # GoReleaser, not a hand-rolled build matrix. The config is verified
    # locally: `goreleaser release --snapshot` produces 5 cross-compiled
    # binaries, checksums, and an SBOM generated by SCRAM itself.
    needs: [build, lint, dogfood, sbom-validate, corpus]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless cosign mints an OIDC token; without this the signing step
      # cannot obtain one and fails at the last moment.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: GoReleaser derives the changelog and
          # mod_timestamp from it.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      # Pinned to an exact patch. Taking whatever is newest for the tool
      # that builds and signs the release is the wrong default.
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.5.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign for GoReleaser
        # GoReleaser's own `signs:` block in .goreleaser.yml signs every
        # binary keyless, and it invokes `cosign` from PATH. cosign is not
        # preinstalled on the runner, so without this the release fails at
        # the signing step with:
        #
        #   sign: cosign failed: exec: "cosign": executable file not found
        #
        # which is exactly what v0.1.0-rc1 did on its first run.
        #
        # There was a second, hand-written signing step here as well,
        # doing the same job with a loop and a count check. Two mechanisms
        # signing the same artifacts is one too many, and the hand-written
        # one was the dangerous kind: it looked like the signing path and
        # was in fact redundant with it. It was never exercised, because
        # every local verification ran `goreleaser --skip=sign`, which
        # skips both. The comment on it claimed the loop had been
        # "verified against real snapshot artifacts" -- true, and beside
        # the point, because the snapshots skipped signing entirely.
        #
        # Pinned to an exact version. Unpinned would be the same mistake
        # as an unpinned action, and worse: this one signs the release.
        run: |
          set -euo pipefail
          COSIGN_VERSION=v2.4.1
          curl -sSfL -o /usr/local/bin/cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          chmod +x /usr/local/bin/cosign
          cosign version | head -1

      # GoReleaser uploads the binaries, archives, checksums and the
      # release SBOM itself. The signatures and certificates are the
      # exception: they sit next to each binary under
      # dist/scram_<os>_<arch>/ rather than at the top of dist/, so they
      # need collecting explicitly. fail_on_unmatched_files is false
      # because this step runs after goreleaser has already published,
      # and a missing signature file there must not fail a release whose
      # binaries are already up.
      - name: Upload signatures and certificates
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.pem
            dist/**/*.sig
          fail_on_unmatched_files: false
