# GoReleaser configuration.
#
# Prepared but never executed: cutting a tag is a human decision, so this
# file exists to make that decision cheap and reproducible rather than to
# automate it away. See docs/STATUS.md and docs/BLOCKED.md.
#
# The release it produces is the project's own supply-chain claim, so the
# parts that matter are the ones a security tool cannot skip:
#
#   * every binary is checksummed, so a download can be verified
#   * every binary is signed keyless with cosign, so provenance does not
#     rest on the GitHub account alone
#   * the SBOM attached to the release is generated by that release's own
#     binary from its own tree
#   * the module is published as a Go module proxy artifact, so
#     `go install` resolves the same bits the release attached

version: 2

project_name: scram

before:
  hooks:
    # Refuse to package a tree that does not pass. A release built from a
    # red suite is a way of shipping a vulnerability scanner that does not
    # work.
    - go mod tidy
    - go test ./...
    # One SBOM for the release, generated by SCRAM's own code from this
    # tree, using a host binary.
    #
    # The obvious configuration -- an `sboms:` block with
    # `artifacts: binary` -- cannot work here, and GoReleaser is right to
    # refuse it. It would run each artifact's own binary to produce that
    # artifact's SBOM, but a darwin/arm64 binary does not execute on the
    # Linux runner that is cross-compiling it, so the step fails for 4 of
    # the 5 targets. That is not a config bug to work around: the release
    # is built from one source tree, so it has one dependency inventory and
    # needs one SBOM. The per-binary variant only makes sense for a
    # third-party cataloger like syft, which runs on the host.
    # The release's own SBOM, generated by this project's own code from
    # this tree. It goes to a directory outside dist/ on purpose: before
    # hooks run before `dist/` is cleaned, so writing there loses the output
    # and the release aborts with "dist is not empty". The copy into dist/
    # is the `before` hook immediately below, which runs afterwards.
    - go run ./cmd/scram sbom generate . --format both --out .release-sbom

builds:
  - id: scram
    main: ./cmd/scram
    binary: scram
    env:
      - CGO_ENABLED=0
    # darwin/linux/windows on both architectures. CGO is off throughout:
    # this is a static binary that talks HTTPS and execs git, and a cgo
    # dependency would make the "just download and run" install true only on
    # the machine it was built on.
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows/arm64 is not a target anyone asks for and doubles the
      # matrix for no user.
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/0xsan7/scram/internal/cli.Version={{ .Version }}
      # These two used to say `main.commit` and `main.date`. No such
      # symbols exist in this module, and the linker silently ignores a
      # -X path that does not resolve -- the build succeeds, the
      # variables keep their defaults, and nothing reports an error.
      # Confirmed with `go tool nm` against a binary built with the old
      # flags: no main.commit symbol at all.
      - -X github.com/0xsan7/scram/internal/cli.Commit={{ .Commit }}
      - -X github.com/0xsan7/scram/internal/cli.Date={{ .Date }}
      # Reproducible builds: record the toolchain so two runs of the same
      # commit agree. Without this, Go embeds build paths and the
      # checksums differ between otherwise identical builds, which makes
      # the checksum file useless as a provenance check.
      - -buildid=
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: default
    builds:
      - scram

    # One archive per OS/arch pair, each containing just the binary. A
    # single archive with every platform inside it is the usual
    # arrangement and it is wrong for this project: the install
    # instructions in the README are a single curl, and a user should not
    # have to extract the right file out of a 200 MB tarball.
    format: binary
    name_template: '{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    files:
      - LICENSE
      - README.md
      - LIMITATIONS.md

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
  algorithm: sha256

signs:
  - artifacts: binary
    # Keyless: no long-lived signing key exists to leak, and the signature
    # is bound to the workflow identity by OIDC rather than to a secret
    # someone had to protect. This is the strongest option available
    # without a key-management service.
    cmd: cosign
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - --yes
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - ${artifact}
    env:
      - COSIGN_EXPERIMENTAL=1
    # The public transparency-log entry is the artifact a verifier
    # actually checks, so it is published alongside the signature rather
    # than left in the log alone.
    output: true

release:
  prerelease: auto
  # The SBOM produced in the before hook ships with the release, so a
  # consumer can enumerate exactly what the released binary was built from
  # without re-running anything. It is read from `.release-sbom/` rather
  # than `dist/` because `--clean` empties dist/ after the before hooks run,
  # which is also what makes a dist/-writing hook fail with
  # "dist is not empty".
  extra_files:
    - glob: ./.release-sbom/*

  # The footer used {{ .Os }} and {{ .Arch }}, which are artifact-only
  # template keys. They are not in scope for a release footer, and
  # GoReleaser does not warn about an unknown key -- it fails at publish
  # time, after the build, after signing, and after the changelog:
  #
  #   scm releases: failed to publish artifacts: template: failed to apply
  #   "...": map has no entry for key "Os"
  #
  # which is what the third v0.1.0-rc1 run did. The verification
  # instructions below therefore name the assets literally instead of
  # interpolating a per-artifact loop, and the loop is in a shell
  # snippet a reader can run, which is what a reader would have done
  # anyway.
  footer: |
    ## Verifying this release

    Every binary is checksummed and signed keyless, and the signature is
    bound to this workflow's identity through the public Rekor log.

    ```bash
    # 1. Checksums -- one file covers all five targets
    sha256sum -c scram_{{ .Version }}_checksums.txt

    # 2. Signatures. The .pem and .sig files sit beside each binary, under
    #    scram_<os>_<arch>/. This loop checks every one of them.
    for f in scram-*/scram scram-*/scram.exe; do
      [ -f "$f" ] || continue
      cosign verify-blob \
        --certificate "$f.pem" \
        --signature    "$f.sig" \
        --certificate-identity-regexp 'https://github.com/0xsan7/SCRAM/' \
        --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        "$f"
    done
    ```

    Built from commit `{{ .ShortCommit }}` on `{{ .Branch }}`.

    The CycloneDX and SPDX SBOMs ship as release assets, generated by
    this project's own code from this repository, so you can enumerate
    exactly what the released binary was built from without re-running
    anything.

  draft: false

changelog:
  sort: asc

  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
  # Group by type so a reader scanning a release sees behaviour changes
  # first. These are regular expressions matched against the commit subject,
  # not the `type:` front-matter git uses -- verified against
  # config.ChangelogGroup, which has exactly Title/Regexp/Order and no
  # filters field.
  groups:
    - title: Security
      order: 0
      regexp: '^.*?(security|vuln|CVE-\d+).*$'
    - title: Features
      order: 1
      regexp: '^.*?feat(\(.*?\))?!?:.*$'
    - title: Fixes
      order: 2
      regexp: '^.*?fix(\(.*?\))?!?:.*$'
    - title: Other
      order: 999
      regexp: '^.*$'
