name: SCRAM Supply Chain Scan
description: >
  Scan a pull request for new supply chain risk. Blocks the PR only on
  findings that are new relative to the baseline, so pre-existing issues
  don't make every pull request red.
author: 0xsan7
branding:
  icon: shield
  color: purple

inputs:
  fail-on:
    description: 'Severity threshold (clean, low, medium, high, critical).'
    required: false
    default: 'high'
  sbom-formats:
    description: 'Comma-separated SBOM formats to write (cyclonedx, spdx).'
    required: false
    default: 'cyclonedx'
  comment-on-pr:
    description: 'Post or update a PR comment summarizing the drift.'
    required: false
    default: 'true'
  upload-sarif:
    description: 'Upload results to the GitHub Security tab.'
    required: false
    default: 'false'
  config-path:
    description: 'Path to the .scram.yml policy file.'
    required: false
    default: '.scram.yml'
  baseline-ref:
    description: >
      Git ref to diff against. Defaults to the PR base branch. Set to an
      empty string to diff against the committed .scram/baseline.json instead.
    required: false
    default: ''
  epss:
    description: 'Enable EPSS exploitability scoring (more upstream requests).'
    required: false
    default: 'false'
  scram-version:
    description: >-
      Version of the scram binary to download, without the leading "v"
      (e.g. 0.1.0-rc2). Defaults to the version of the tag this action is
      referenced by, so `uses: 0xsan7/SCRAM@v0.1.0-rc2` installs
      0.1.0-rc2 and nothing else.
    required: false
    default: ''
  github-token:
    description: >-
      Token used for the PR comment and the SARIF upload. Defaults to the
      workflow's own GITHUB_TOKEN. Override with a PAT only if you need
      permissions the workflow's token does not have.
    required: false
    default: ${{ github.token }}

outputs:
  sbom-path:
    description: 'Directory containing the generated SBOMs.'
    value: ${{ steps.scram.outputs.sbom-path }}
  repo-score:
    description: 'Aggregate repository risk score, 0-65. The presented scale is 65, the number of points the tool can actually earn; see the README for the term breakdown and the bucket boundaries.'
    value: ${{ steps.scram.outputs.repo-score }}
  repo-bucket:
    description: 'Aggregate repository severity bucket.'
    value: ${{ steps.scram.outputs.repo-bucket }}
  new-critical-count:
    description: 'Number of newly introduced critical findings.'
    value: ${{ steps.scram.outputs.new-critical-count }}
  new-high-count:
    description: 'Number of newly introduced high findings.'
    value: ${{ steps.scram.outputs.new-high-count }}

runs:
  using: composite
  steps:
    - name: Install scram
      shell: bash
      env:
        # github.action_ref is the tag the caller referenced this action
        # by. It is only readable through `env`, never inline in `run` --
        # GitHub's own docs call that out for composite actions. When the
        # action is used as `0xsan7/SCRAM@v0.1.0-rc2` this is
        # "v0.1.0-rc2", which is what makes the default version below
        # correct without the caller having to state it twice.
        ACTION_REF: ${{ github.action_ref }}
        WANTED_VERSION: ${{ inputs.scram-version }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail

        # GoReleaser names assets {{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}
        # (.goreleaser.yml, archives[].name_template), and .Version has no
        # leading "v" while the tag does. The previous version of this step
        # asked for "scram-linux-amd64", which has never existed for any
        # release, and the first release attempt proved it: the smoke test
        # got a 404 from both URL shapes.
        # runner.os and runner.arch are the runner's vocabulary, not
        # GoReleaser's, and they disagree on both axes: the runner says
        # "Linux"/"X64", the assets are "linux"/"amd64". Substituting one
        # for the other produces a URL that 404s, which is what happened
        # the first time this step was written.
        case "$RUNNER_OS" in
          Linux)   os=linux   ;;
          macOS)   os=darwin  ;;
          Windows) os=windows ;;
          *) echo "::error::unsupported runner OS: $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64|AMD64|x64)  arch=amd64 ;;
          ARM64)          arch=arm64 ;;
          *) echo "::error::unsupported runner arch: $RUNNER_ARCH"; exit 1 ;;
        esac

        # The action's own tag is the default version, so a caller who
        # pins the action gets the binary that was published alongside it.
        # An explicit scram-version input overrides that.
        version="${WANTED_VERSION:-${ACTION_REF#v}}"

        # A ref that is not a version cannot name a release: a branch, a
        # SHA, or the empty ref you get when the action is used by path.
        # Fail loudly rather than download something unverified.
        #
        # The test is a full-semver shape, deliberately. An earlier version
        # of this step accepted anything starting with a digit, which a
        # 40-character commit SHA does whenever its first hex digit is
        # numeric -- roughly 62% of them. Those refs then built an asset
        # name like `scram-03c5a1c67e00...-linux-amd64` and 404'd, with a
        # message about a missing release rather than about the ref.
        if ! printf '%s' "$version" \
             | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
          echo "::error::cannot determine which scram version to install."
          echo "::error::The action was referenced as '${ACTION_REF:-<empty>}', which is not a version tag."
          echo "::error::Pin it to a version tag (uses: 0xsan7/SCRAM@v0.1.0-rc2)"
          echo "::error::or set the scram-version input explicitly."
          exit 1
        fi

        # windows-amd64.exe is the only asset with an extension.
        ext=""
        [ "$os" = "windows" ] && ext=".exe"

        asset="scram-${version}-${os}-${arch}${ext}"
        base="https://github.com/0xsan7/SCRAM/releases/download/v${version}"
        url="${base}/${asset}"

        echo "Installing ${asset} (action ref: ${ACTION_REF:-<none>})"

        # A 404 here is almost always "this tag has no release", which is a
        # different problem from a network failure and deserves a different
        # message. curl -f prints "The requested URL returned error: 404"
        # and exits 22, which says nothing about which of the two happened.
        if ! curl -sSfL "$url" -o "$RUNNER_TEMP/scram${ext}"; then
          echo "::error::could not download $url"
          if curl -sSfL -o /dev/null "${base}/scram_${version}_checksums.txt" 2>/dev/null; then
            echo "::error::that release exists but does not publish $asset for $os/$arch."
          else
            echo "::error::there is no published release for version ${version}."
            echo "::error::Every version tag needs a GitHub Release built from it;"
            echo "::error::pushing the tag alone does not create one."
          fi
          exit 1
        fi
        chmod +x "$RUNNER_TEMP/scram${ext}"

        # Verify the download against the published checksum file. Without
        # this, a 200 from a proxy or a truncated transfer would be
        # indistinguishable from a good install, and the scan would run on
        # an unverified binary.
        #
        # The checksum file lists assets by their *published* names, but
        # the file on disk is called "scram". Rename it to the asset name,
        # check it there, and only then move it into place as "scram" --
        # so the binary that gets executed is provably the one that was
        # verified, under a name nothing rewrites afterwards.
        curl -sSfL "${base}/scram_${version}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
        mv "$RUNNER_TEMP/scram${ext}" "$RUNNER_TEMP/${asset}"
        ( cd "$RUNNER_TEMP" && grep -F " ${asset}" checksums.txt | sha256sum -c - )
        mv "$RUNNER_TEMP/${asset}" "$RUNNER_TEMP/scram${ext}"

        "$RUNNER_TEMP/scram${ext}" --version

    - name: Resolve baseline
      id: baseline
      shell: bash
      env:
        BASELINE_REF: ${{ inputs.baseline-ref }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail

        if [ "$EVENT_NAME" != "pull_request" ]; then
          echo "ref=" >> "$GITHUB_OUTPUT"
          echo "Not a pull_request event; scanning without a baseline."
          exit 0
        fi

        ref="${BASELINE_REF:-$BASE_SHA}"
        echo "Comparing against $ref"

        # actions/checkout defaults to fetch-depth: 1, so the local clone
        # holds exactly one commit -- the merge ref. The base branch tip is
        # not in it, and `git worktree add` then fails with
        #
        #   fatal: invalid reference: <base sha>
        #
        # which is what the first pull_request run of this action did. The
        # action's entire documented purpose is the PR gate, and it could
        # not run on a PR at all.
        #
        # The README tells callers to use fetch-depth: 0. That is good
        # advice and it is not a requirement the action should impose: a
        # security gate that only works if the caller read the docs is a
        # gate that silently does not run. Fetch the one commit that is
        # actually needed, which costs one object rather than a full
        # history, and fall back to deepening if the server refuses a
        # direct SHA fetch.
        if ! git cat-file -e "${ref}^{commit}" 2>/dev/null; then
          echo "Base commit not in the local clone; fetching it."
          if ! git fetch --no-tags --depth=1 origin "$ref" 2>/dev/null; then
            echo "Direct SHA fetch refused; fetching the full base branch."
            git fetch --no-tags --depth=50 origin \
              "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}" || {
                echo "::error::could not fetch the base branch ($GITHUB_BASE_REF)."
                echo "::error::Set fetch-depth: 0 on actions/checkout, or set the"
                echo "::error::baseline-ref input to something already fetched."
                exit 1
              }
            git fetch --no-tags --depth=1 origin "$ref" 2>/dev/null || true
          fi
        fi

        if ! git cat-file -e "${ref}^{commit}" 2>/dev/null; then
          echo "::error::base commit $ref is still not available after fetching"
          exit 1
        fi

        # Materialize the base ref into a separate worktree so the diff is a
        # real tree-to-tree comparison, not a guess based on the PR's own
        # lockfile. FR-403: the user should not have to manage this.
        rm -rf "$RUNNER_TEMP/baseline"
        git worktree add --detach "$RUNNER_TEMP/baseline" "$ref"

        bin="$RUNNER_TEMP/scram${{ runner.os == 'Windows' && '.exe' || '' }}"

        if [ -f "$RUNNER_TEMP/baseline/.scram/baseline.json" ]; then
          echo "Using the committed baseline from the base branch"
          cp "$RUNNER_TEMP/baseline/.scram/baseline.json" "$RUNNER_TEMP/base.json"
        else
          # No committed baseline: scan the base tree and store it as the
          # comparison point. This is what makes the Action work on day one
          # with zero setup.
          #
          # `scram baseline update` and not `scram scan --format json`.
          # They are different file formats. A baseline is
          # model.Baseline -- {schema_version, generated_at, repo,
          # components, summary} -- and drift.ReadBaseline reads
          # top-level "components". A scan report nests them under
          # "scan". Feeding one to the other parses cleanly, yields an
          # EMPTY component list, and therefore reports every
          # pre-existing vulnerability as new.
          #
          # The effect was the exact opposite of the Action's promise: on
          # a repository with unchanged dependencies, the gate failed on
          # every finding the repository already had. The README says
          # "Blocks the PR only on findings that are new relative to the
          # baseline, so pre-existing issues don't make every pull
          # request red" -- and the baseline could never suppress
          # anything.
          echo "No committed baseline; scanning the base branch as the baseline"
          (
            cd "$RUNNER_TEMP/baseline"
            "$bin" baseline update --out "$RUNNER_TEMP/base.json" \
              --config "$RUNNER_TEMP/baseline/${{ inputs.config-path }}"
          )
        fi

        # A baseline that parsed but holds no components suppresses
        # nothing, and the resulting gate looks like a policy failure
        # rather than the broken comparison it is. Refuse to continue.
        if ! jq -e '(.components // []) | length > 0' "$RUNNER_TEMP/base.json" > /dev/null; then
          echo "::error::baseline resolved 0 components; every finding would be reported as new."
          echo "::error::This is a baseline-format problem, not a policy failure."
          exit 1
        fi
        echo "ref=$RUNNER_TEMP/base.json" >> "$GITHUB_OUTPUT"

    - name: Run scan
      id: scram
      shell: bash
      env:
        BASE_JSON: ${{ steps.baseline.outputs.ref }}
        OUT_DIR: ${{ github.workspace }}/scram-output
      run: |
        set -euo pipefail

        args=(
          scan .
          --fail-on "${{ inputs.fail-on }}"
          --config "${{ inputs.config-path }}"
          --sbom "${{ inputs.sbom-formats }}"
          --out "$OUT_DIR"
          --format json
        )
        [ "${{ inputs.epss }}" = "true" ] && args+=(--epss)
        [ -n "$BASE_JSON" ] && [ -f "$BASE_JSON" ] && args+=(--baseline "$BASE_JSON")

        # The output directory must exist before the shell opens the
        # redirect target. When it is missing, the redirect fails first,
        # scram never runs, $? is 1, and the branch below reports
        # "SCRAM policy check failed" -- blaming the policy for a crash
        # that happened before the scan started, with every output written
        # as null. That is the failure the first end-to-end run produced.
        mkdir -p "$OUT_DIR"

        # Matches the name the install step produced, including the .exe
        # on Windows. This step hardcoded the bare name, so a Windows
        # runner would have failed here after installing successfully.
        set +e
        "$RUNNER_TEMP/scram${{ runner.os == 'Windows' && '.exe' || '' }}" "${args[@]}" > "$OUT_DIR/scan.json"
        exit_code=$?
        set -e

        # An absent or empty scan.json is a crash, not a verdict. Reported
        # as its own failure so a user is never told their policy failed
        # when the scanner produced nothing at all.
        if [ ! -s "$OUT_DIR/scan.json" ]; then
          echo "::error::scram produced no output (exit $exit_code) -- scanner failure, not a policy failure"
          exit 2
        fi

        # Exit 1 is a policy failure (expected, that's the gate working).
        # Exit 2 means the scanner itself broke, which must be distinguished.
        if [ "$exit_code" -gt 1 ]; then
          echo "::error::scram failed to run (exit $exit_code)"
          exit "$exit_code"
        fi

        # Drift-derived counts live under .drift.summary, not .scan.summary:
        # the scan summary describes the current state, the drift summary
        # describes what this change introduced. Reading the wrong one
        # silently yields nulls and a PR comment claiming "0 new findings".
        {
          echo "sbom-path=$OUT_DIR"
          echo "repo-score=$(jq -r '.scan.summary.repo_score' "$OUT_DIR/scan.json")"
          echo "repo-bucket=$(jq -r '.scan.summary.repo_bucket' "$OUT_DIR/scan.json")"
          echo "new-critical-count=$(jq -r '.drift.summary.new_critical_count // 0' "$OUT_DIR/scan.json")"
          echo "new-high-count=$(jq -r '.drift.summary.new_high_count // 0' "$OUT_DIR/scan.json")"
        } >> "$GITHUB_OUTPUT"

        if [ "$exit_code" -eq 1 ]; then
          echo "::error::SCRAM policy check failed"
          exit 1
        fi

    - name: Produce SARIF
      id: sarif
      if: ${{ inputs.upload-sarif == 'true' }}
      shell: bash
      env:
        BASE_JSON: ${{ steps.baseline.outputs.ref }}
        OUT_DIR: ${{ github.workspace }}/scram-output
      run: |
        set -euo pipefail
        # SARIF is written to STDOUT, not to --out: --out is the SBOM
        # directory, and the machine formats are designed so that stdout
        # stays a single valid document and the policy text goes to stderr.
        # Re-running is cheap because the vulnerability cache is warm from
        # the scan step above.
        args=(
          scan .
          --format sarif
          --config "${{ inputs.config-path }}"
          --no-gate
        )
        [ "${{ inputs.epss }}" = "true" ] && args+=(--epss)
        [ -n "$BASE_JSON" ] && [ -f "$BASE_JSON" ] && args+=(--baseline "$BASE_JSON")

        # Same reason as the scan step: the redirect target's directory has
        # to exist before the shell opens the file, not after.
        mkdir -p "$OUT_DIR"

        # The install step names the binary scram.exe on Windows. This step
        # hardcoded the bare name, so upload-sarif would have failed on a
        # Windows runner after the install step succeeded.
        "$RUNNER_TEMP/scram${{ runner.os == 'Windows' && '.exe' || '' }}" "${args[@]}" > "$OUT_DIR/scan.sarif"

        # Fail loudly rather than hand GitHub a file that is not SARIF; an
        # invalid upload is silently dropped by the Security tab and looks
        # exactly like "no vulnerabilities found".
        if ! jq -e '.version == "2.1.0" and (.runs | length > 0)' "$OUT_DIR/scan.sarif" > /dev/null; then
          echo "::error::scram did not produce a valid SARIF 2.1.0 document"
          head -20 "$OUT_DIR/scan.sarif"
          exit 1
        fi
        echo "SARIF: $OUT_DIR/scan.sarif ($(jq '.runs[0].results | length' "$OUT_DIR/scan.sarif") result(s))"

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: scram-output/scan.sarif
        category: scram
        # upload-sarif reads GITHUB_TOKEN from its environment, not from
        # the caller's secrets context, because a composite action cannot
        # supply one. github/codeql-action also requires
        # `security-events: write`, which the action cannot request for
        # itself -- the calling workflow has to grant it.
        token: ${{ inputs.github-token }}

    - name: Comment on PR
      if: ${{ inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        # Composite actions cannot read the secrets context at all --
        # referencing secrets.GITHUB_TOKEN here made the runner reject the
        # whole manifest at load time, so the action could not run at all,
        # for anyone, on any event. The token arrives via the
        # github-token input instead.
        GH_TOKEN: ${{ inputs.github-token }}
        SCAN_JSON: ${{ github.workspace }}/scram-output/scan.json
        COMMENT_MARKER: '<!-- scram-report -->'
      run: |
        set -euo pipefail

        # Build the comment body.
        {
          echo "$COMMENT_MARKER"
          echo "## SCRAM supply chain report"
          echo
          jq -r '
            "| | |",
            "|---|---|",
            "| Repo score | \(.scan.summary.repo_score)/65 (\(.scan.summary.repo_bucket)) |",
            "| Components | \(.scan.summary.total_components) |",
            "| New vulnerabilities | \((.drift.summary.new_vuln_ids // []) | length) |",
            "| New high | \(.drift.summary.new_high_count // 0) |",
            "| New critical | \(.drift.summary.new_critical_count // 0) |"
          ' "$SCAN_JSON"

          new_ids=$(jq -r '(.drift.summary.new_vuln_ids // []) | length' "$SCAN_JSON")
          if [ "$new_ids" -gt 0 ]; then
            echo
            echo "### New findings"
            echo
            echo "| Component | New findings |"
            echo "|---|---|"
            # One row per component that has at least one of the new ids.
            jq -r --argjson new "$(jq -c '.drift.summary.new_vuln_ids // []' "$SCAN_JSON")" '
              .scan.components[]
              | select(.vulnerabilities | length > 0)
              | . as $c
              | [$c.vulnerabilities[]
                 | select(.id as $i | $new | index($i))
                 | .id] as $hit
              | select($hit | length > 0)
              | "| `\($c.purl)` | \($hit | join(", ")) |"
            ' "$SCAN_JSON" | head -25
          fi

          echo
          echo "<details><summary>Full report</summary>"
          echo
          echo '```'
          jq -r '.scan.summary.counts_by_bucket | to_entries[] | "\(.key): \(.value)"' "$SCAN_JSON"
          echo '```'
          echo
          echo "</details>"
        } > "$RUNNER_TEMP/comment.md"

        # FR-604: update the existing comment rather than posting a new one on
        # every push, which is what turns a bot into PR spam.
        comment_id=$(gh api \
          "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" \
          --paginate \
          --jq ".[] | select(.body | contains(\"$COMMENT_MARKER\")) | .id" | head -1)

        if [ -n "$comment_id" ]; then
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
            -f body="$(cat "$RUNNER_TEMP/comment.md")" > /dev/null
          echo "Updated existing SCRAM comment"
        else
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="$(cat "$RUNNER_TEMP/comment.md")" > /dev/null
          echo "Posted SCRAM comment"
        fi
