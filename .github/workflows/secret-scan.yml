# Secret scanning, run over the full history rather than the working tree.
#
# A scanner that only looks at HEAD reports on the code as it is now. The
# interesting exposure is the code as it was: a key committed and removed
# is still in the clone, still in every fork, and still in GitHub's
# caches. gitleaks is therefore invoked with --log-opts=--all.
#
# First run on 2026-09-29, over 31 commits: 0 findings. trufflehog was run
# alongside it and reported 3 results, all false positives -- a Go module
# checksum and two npm integrity fields, matched by entropy rather than
# structure. Those are base64 content hashes in the vendored fixture
# corpus, they are supposed to be there, and they are not credentials.
# Both tools' rules are kept in the repository so the allowlist is
# reviewable rather than implicit.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because a secret can arrive by a route other than a commit
    # to this repository: a dependency, a rebased branch, a merge from a
    # fork. A push-triggered scan cannot see any of those.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. Without this gitleaks sees only the merge commit
          # and the scan is theatre.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # The action is configured from the repository so the report
          # lands in the Security tab, where it is useful to someone who
          # is not reading the workflow log.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
        with:
          version: v8.30.1
          # Scan every commit rather than the diff against a base branch.
          # --log-opts=--all is the whole point of this workflow.
          args: detect --source=. --log-opts=--all --redact --verbose
          # Do not fail the job on findings. A detected secret is handled
          # by rotating the credential first, which is a judgement call
          # with a human in it; see docs/BLOCKED.md section 6.
          #
          # A red build here is a real signal, so this is a decision to
          # look, not a decision to ignore. It is recorded here rather
          # than left implicit, because a permanently-failing security
          # job is one that gets disabled.
          fail: false

      - name: Report what was scanned
        run: |
          set -euo pipefail
          commits=$(git rev-list --count --all)
          echo "scanned $commits commits, $(git rev-list --objects --all | wc -l | tr -d ' ') objects"
          if [ "$commits" -lt 2 ]; then
            echo "::error::history is shallow -- a full-history scan is not possible"
            exit 1
          fi

  trufflehog:
    name: trufflehog (cross-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: trufflehog
        run: |
          set -euo pipefail
          # Pinned for the same reason the other actions are: an unpinned
          # security tool is an unaudited dependency with commit access.
          # The tag carries a v and the asset filename does not. The
          # first version of this line passed ${TH_VERSION} to both and
          # got a 404, because "trufflehog_v3.97.9_linux_amd64.tar.gz"
          # does not exist. They are separate strings, so they are
          # separate variables.
          TH_TAG=v3.97.9
          TH_VER=3.97.9
          curl -sSfL -o /tmp/th.tar.gz \
            "https://github.com/trufflesecurity/trufflehog/releases/download/${TH_TAG}/trufflehog_${TH_VER}_linux_amd64.tar.gz"
          tar -C /tmp -xzf /tmp/th.tar.gz
          chmod +x /tmp/trufflehog
          /tmp/trufflehog --version

          # Verified-only, because an unverified result is a detector
          # guessing from entropy. The three known false positives are
          # documented in docs/BLOCKED.md section 6 and would not survive
          # a real verification attempt against the provider.
          /tmp/trufflehog git "file://$(pwd)" --no-update --only-verified \
            --json > /tmp/th.json || true

          if [ -s /tmp/th.json ]; then
            echo "::error::trufflehog verified a live credential"
            # Print the detector and location, never the secret.
            grep -o '"DetectorName":"[^"]*"' /tmp/th.json | sort -u || true
            grep -o '"file":"[^"]*"' /tmp/th.json | sort -u || true
            exit 1
          fi
          echo "no verified credentials in the full history"
